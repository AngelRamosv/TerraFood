openapi: 3.1.0
info:
  title: TERRAFOOD · Fuego & Botánica — OpenSpec API
  version: 1.0.0
  description: >
    Especificación OpenAPI 3.1.0 bajo metodología Open Spec-Driven Development (SDD)
    para el restaurante de alta cocina contemporánea TERRAFOOD · Fuego & Botánica.
servers:
  - url: http://localhost:8000
    description: Servidor Full-Stack Local (FastAPI + SQLite)
paths:
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión de comensal
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
  /api/v1/auth/register:
    post:
      summary: Registrar un nuevo comensal
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Comensal creado y autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/menu:
    get:
      summary: Obtener catálogo de Platos Fuertes y Postres
      tags: [Menu]
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
            enum: [platos_fuertes, postres]
      responses:
        '200':
          description: Lista de platillos del menú
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
  /api/v1/orders:
    post:
      summary: Crear y almacenar un nuevo pedido en base de datos
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Pedido almacenado exitosamente en SQLite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/v1/orders/my:
    get:
      summary: Obtener historial de pedidos del usuario autenticado
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos almacenados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RegisterRequest:
      type: object
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        tier:
          type: string
        created_at:
          type: string
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        subtitle:
          type: string
        category:
          type: string
          enum: [platos_fuertes, postres]
        description:
          type: string
        price:
          type: number
        image_url:
          type: string
        badge:
          type: string
        prep_time_min:
          type: integer
        calories:
          type: integer
        pairing:
          type: string
        rating:
          type: number
    OrderItemInput:
      type: object
      required: [menu_item_id, quantity]
      properties:
        menu_item_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        custom_note:
          type: string
    OrderCreateRequest:
      type: object
      required: [service_type, table_or_address, items]
      properties:
        service_type:
          type: string
          enum: [mesa, para_llevar, domicilio]
        table_or_address:
          type: string
        chef_notes:
          type: string
        tip_percentage:
          type: number
          default: 10
        payment_method:
          type: string
          default: Tarjeta Black / Apple Pay
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderItemDetail:
      type: object
      properties:
        id:
          type: integer
        menu_item_id:
          type: integer
        dish_name:
          type: string
        category:
          type: string
        image_url:
          type: string
        quantity:
          type: integer
        unit_price:
          type: number
        line_total:
          type: number
        custom_note:
          type: string
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
        folio:
          type: string
        user_id:
          type: integer
        customer_name:
          type: string
        customer_email:
          type: string
        service_type:
          type: string
        table_or_address:
          type: string
        chef_notes:
          type: string
        payment_method:
          type: string
        subtotal:
          type: number
        tax:
          type: number
        tip:
          type: number
        total:
          type: number
        status:
          type: string
        created_at:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDetail'
